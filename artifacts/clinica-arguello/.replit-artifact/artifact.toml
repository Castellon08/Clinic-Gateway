kind = "web"
previewPath = "/"
title = "Clínica Odontológica Argüello"
version = "1.0.0"
id = "artifacts/clinica-arguello"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21205

[services.development]
run = "pnpm --filter @workspace/clinica-arguello run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinica-arguello", "run", "build" ]
publicDir = "artifacts/clinica-arguello/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21205"
BASE_PATH = "/"
