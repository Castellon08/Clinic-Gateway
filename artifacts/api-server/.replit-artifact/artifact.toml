kind = "api"
previewPath = "/api"
title = "API Server (Django)"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd /home/runner/workspace/artifacts/django-api && /home/runner/workspace/.pythonlibs/bin/python manage.py runserver 0.0.0.0:8080"

[services.production]

[services.production.build]
args = ["echo", "no build needed"]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/artifacts/django-api && /home/runner/workspace/.pythonlibs/bin/gunicorn clinica_project.wsgi:application --bind 0.0.0.0:8080 --workers 2"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
